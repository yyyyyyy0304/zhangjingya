<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>商品列表 — Fetch 实战</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: "Microsoft YaHei", "宋体", sans-serif;
            background: #f6f2ea;
            color: #17212b;
            padding: 40px 20px 60px;
            line-height: 1.8;
        }
        .zhang_container { max-width: 1000px; margin: 0 auto; }
        .zhang_home-link {
            display: inline-block;
            margin-bottom: 20px;
            color: #bd493c;
            text-decoration: none;
            font-size: 14px;
        }
        .zhang_home-link:hover { text-decoration: underline; }
        h1 {
            text-align: center;
            font-size: 30px;
            margin-bottom: 8px;
            color: #2d7c7a;
        }
        .zhang_subtitle {
            text-align: center;
            color: #687681;
            margin-bottom: 36px;
            font-size: 14px;
        }
        .zhang_intro {
            background: #fffdf8;
            border-left: 4px solid #e96c55;
            padding: 12px 18px;
            font-size: 14px;
            margin-bottom: 22px;
            border-radius: 0 4px 4px 0;
        }
        .zhang_intro code {
            font-family: "Consolas", "Courier New", monospace;
            font-size: 12.5px;
            color: #bd493c;
            background: #f0ebe0;
            padding: 1px 5px;
            border-radius: 3px;
        }

        /* ===== 演示卡片 ===== */
        .zhang_demo {
            background: #fffdf8;
            border: 1px solid #d9d2c5;
            border-radius: 6px;
            margin-bottom: 18px;
            overflow: hidden;
        }
        .zhang_demo-head {
            background: #2d7c7a;
            color: #fffdf8;
            padding: 10px 18px;
            font-size: 15px;
            font-weight: bold;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .zhang_demo-head .zhang_tag {
            background: rgba(255,255,255,0.22);
            padding: 2px 10px;
            border-radius: 12px;
            font-size: 12px;
            font-weight: normal;
        }

        /* ===== 可视化区 ===== */
        .zhang_visual {
            padding: 16px 18px;
            background: #fff8e1;
            border-top: 1px dashed #d9d2c5;
        }

        /* ===== 按钮 ===== */
        .zhang_btn {
            background: #bd493c;
            color: #fff;
            border: none;
            padding: 7px 16px;
            font-size: 13px;
            border-radius: 4px;
            cursor: pointer;
            margin: 10px 6px 0 0;
            font-family: "Microsoft YaHei", sans-serif;
            transition: background 0.2s;
        }
        .zhang_btn:hover { background: #e96c55; }
        .zhang_btn.zhang_alt { background: #2d7c7a; }
        .zhang_btn.zhang_alt:hover { background: #3a9a97; }

        /* ===== 状态条 ===== */
        .zhang_status {
            padding: 10px 16px;
            border-radius: 4px;
            font-size: 13px;
            margin: 12px 0;
            display: none;
        }
        .zhang_status.zhang_loading {
            display: block;
            background: #e3f2fd;
            color: #1565c0;
            border: 1px solid #90caf9;
        }
        .zhang_status.zhang_error {
            display: block;
            background: #fbe9e7;
            color: #c62828;
            border: 1px solid #ef9a9a;
        }
        .zhang_status.zhang_success {
            display: block;
            background: #e8f5e9;
            color: #2e7d4f;
            border: 1px solid #a5d6a7;
        }

        /* ===== 商品网格 ===== */
        .zhang_products {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
            gap: 16px;
            margin-top: 16px;
        }
        .zhang_product-card {
            background: #fff;
            border: 1px solid #d9d2c5;
            border-radius: 6px;
            overflow: hidden;
            cursor: pointer;
            transition: box-shadow 0.2s, transform 0.2s;
            text-decoration: none;
            color: inherit;
            display: block;
        }
        .zhang_product-card:hover {
            box-shadow: 0 4px 16px rgba(0,0,0,0.12);
            transform: translateY(-2px);
        }
        .zhang_product-img {
            width: 100%;
            height: 180px;
            object-fit: cover;
            background: #f0ebe0;
            display: block;
        }
        .zhang_product-info {
            padding: 12px 14px;
        }
        .zhang_product-brand {
            font-size: 11px;
            color: #888;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .zhang_product-title {
            font-size: 15px;
            font-weight: bold;
            color: #17212b;
            margin: 4px 0 8px;
            line-height: 1.4;
        }
        .zhang_product-desc {
            font-size: 12px;
            color: #687681;
            line-height: 1.5;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
            margin-bottom: 8px;
        }
        .zhang_product-price {
            font-size: 18px;
            color: #bd493c;
            font-weight: bold;
        }
        .zhang_product-price .zhang_old {
            font-size: 12px;
            color: #aaa;
            text-decoration: line-through;
            font-weight: normal;
            margin-left: 6px;
        }
        .zhang_product-meta {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 8px;
            font-size: 12px;
        }
        .zhang_rating { color: #f9a825; }
        .zhang_stock { color: #2e7d4f; }
        .zhang_stock.zhang_low { color: #e65100; }
        .zhang_view-detail {
            margin-top: 8px;
            text-align: right;
            font-size: 12px;
            color: #2d7c7a;
            font-weight: bold;
        }

        /* ===== 提示条 ===== */
        .zhang_tips {
            margin-top: 10px;
            font-size: 12.5px;
            color: #687681;
            background: #fff;
            border: 1px dashed #d9d2c5;
            border-radius: 4px;
            padding: 8px 12px;
        }
        .zhang_tips b { color: #bd493c; }
        .zhang_tips code {
            font-family: "Consolas", "Courier New", monospace;
            font-size: 12px;
            color: #bd493c;
            background: #f0ebe0;
            padding: 1px 4px;
            border-radius: 3px;
        }

        @media (max-width: 640px) {
            body { padding: 24px 14px 40px; }
            h1 { font-size: 24px; }
            .zhang_products {
                grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
                gap: 10px;
            }
        }
    </style>
</head>
<body>
    <div class="zhang_container">
        <a class="zhang_home-link" href="../index.html">← 返回首页</a>
        <h1>商品列表</h1>
        <p class="zhang_subtitle">张婧雅 · fetch 获取列表数据 + 点击查看详情</p>

        <div class="zhang_intro">
            使用 <code>fetch('https://dummyjson.com/products?limit=8')</code> 获取商品列表，
            点击任意商品卡片跳转到 <code>17-3-detail.html?id=商品ID</code> 查看详情。
        </div>

        <div class="zhang_demo">
            <div class="zhang_demo-head">
                商品列表（8 条）
                <span class="zhang_tag" id="zhang_count">加载中…</span>
            </div>
            <div class="zhang_visual">
                <button class="zhang_btn" id="zhang_btn_refresh">▶ 刷新列表</button>
                <div class="zhang_status" id="zhang_status"></div>
                <div class="zhang_products" id="zhang_products"></div>
                <div class="zhang_tips">
                    接口：<code>https://dummyjson.com/products?limit=8</code>
                    —— 返回 <code>{ total, products: [...] }</code>，
                    每个商品含 <code>id</code>、<code>title</code>、<code>price</code>、<code>thumbnail</code> 等字段。
                    点击卡片 → 跳转详情页（URL 参数传 <code>?id=</code>）。
                </div>
            </div>
        </div>
    </div>

    <script>
        /* ================================================================
           工具函数
           ================================================================ */
        function zhang_escape(str) {
            return String(str)
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;');
        }

        function zhang_showStatus(type, msg) {
            var el = document.getElementById('zhang_status');
            el.className = 'zhang_status zhang_' + type;
            el.textContent = msg;
        }

        function zhang_hideStatus() {
            document.getElementById('zhang_status').className = 'zhang_status';
        }

        /* ================================================================
           渲染商品列表
           ================================================================ */
        function zhang_renderList(products) {
            var container = document.getElementById('zhang_products');
            if (!products || products.length === 0) {
                container.innerHTML = '<p style="text-align:center;color:#999;padding:20px;">暂无商品数据</p>';
                return;
            }

            var html = '';
            products.forEach(function(p) {
                var img = p.thumbnail || (p.images && p.images[0]) || '';
                var price = p.price != null ? '$' + p.price : '';
                var oldPrice = p.discountPercentage > 0
                    ? '<span class="zhang_old">$' + (p.price / (1 - p.discountPercentage / 100)).toFixed(2) + '</span>'
                    : '';
                var rating = p.rating != null ? '★ ' + Number(p.rating).toFixed(1) : '';
                var stock = p.stock != null ? p.stock + ' 在库' : '';
                var stockCls = p.stock != null && p.stock < 50 ? 'zhang_low' : '';

                html += '<a class="zhang_product-card" href="17-3-detail.html?id=' + p.id + '">'
                    +    (img ? '<img class="zhang_product-img" src="' + zhang_escape(img) + '" alt="' + zhang_escape(p.title || '') + '" loading="lazy">' : '')
                    +    '<div class="zhang_product-info">'
                    +      (p.brand ? '<div class="zhang_product-brand">' + zhang_escape(p.brand) + '</div>' : '')
                    +      '<div class="zhang_product-title">' + zhang_escape(p.title || '') + '</div>'
                    +      (p.description ? '<div class="zhang_product-desc">' + zhang_escape(p.description) + '</div>' : '')
                    +      '<div class="zhang_product-price">' + price + oldPrice + '</div>'
                    +      '<div class="zhang_product-meta">'
                    +        '<span class="zhang_rating">' + zhang_escape(rating) + '</span>'
                    +        '<span class="zhang_stock ' + stockCls + '">' + zhang_escape(stock) + '</span>'
                    +      '</div>'
                    +      '<div class="zhang_view-detail">查看详情 →</div>'
                    +    '</div>'
                    +  '</a>';
            });
            container.innerHTML = html;
        }

        /* ================================================================
           核心：fetch 获取商品列表
           ================================================================ */
        function zhang_fetchList() {
            var url = 'https://dummyjson.com/products?limit=8';
            zhang_showStatus('loading', '正在请求 ' + url + ' …');
            document.getElementById('zhang_products').innerHTML = '';
            document.getElementById('zhang_count').textContent = '加载中…';

            fetch(url)
                .then(function(res) {
                    if (!res.ok) throw new Error('HTTP ' + res.status + ' ' + res.statusText);
                    return res.json();
                })
                .then(function(data) {
                    var products = data.products || [];
                    document.getElementById('zhang_count').textContent = '共 ' + (data.total || products.length) + ' 条，显示 ' + products.length + ' 条';

                    zhang_showStatus('success', '获取成功！共 ' + products.length + ' 条商品，点击卡片可查看详情。');
                    setTimeout(function() {
                        if (document.getElementById('zhang_status').className.indexOf('zhang_success') !== -1) {
                            zhang_hideStatus();
                        }
                    }, 3000);

                    zhang_renderList(products);
                    console.log('[fetch list] 成功：', data);
                })
                .catch(function(err) {
                    zhang_showStatus('error', '❌ 请求失败：' + err.message + '（请检查网络连接）');
                    document.getElementById('zhang_count').textContent = '加载失败';
                    console.error('[fetch list] 错误：', err);
                });
        }

        /* ================================================================
           事件绑定 & 初始化
           ================================================================ */
        document.getElementById('zhang_btn_refresh').addEventListener('click', zhang_fetchList);

        // 页面加载后自动获取
        zhang_fetchList();
    </script>
</body>
</html>
