<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>盒模型 框模型 box model</title>
    <style>
        body,ul,p,h1,h2,h3,h4,h5,h6{
            margin:0;
            padding:0;
        }
        .a{
            width: 500px;
            height: 300px;
            border: 2px dotted #039;
            padding: 70px 60px 50px 40px;/*上右下左 */
            margin:40px auto;/*居中 */
        }
       .b{
            width: 500px;
            height: 300px;
            border: 2px dashed #039;
            margin:50px auto 40px;/*居中 */
      }
      .c{
            width: 500px;
            height: 300px;
            border: 2px solid #039;
            margin:40px auto 50px;/*居中 */
      }
        </style>
</head>
<body>
    <div class="a">115张婧雅</div>
    <div class="b">115张婧雅</div>
    <div class="c">115张婧雅</div>
</body>
</html>
