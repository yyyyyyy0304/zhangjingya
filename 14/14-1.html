<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h2>张婧雅 javascript</h2>
    <script>
        // 输出：张婧雅，你好、document、alert、console.log
        document.write('张婧雅，你好，document');
        alert('张婧雅，你好，alert');
        console.log('张婧雅，你好，console.log');
        // confirm和prompt
        confirm('张婧雅，你好，confirm');
        prompt('张婧雅，你好，prompt');
        // prompt的返回值是用户输入的内容，需要赋值给一个变量，才能使用它
        var name = prompt('请输入你的姓名');
        console.log(name);
    </script>
</body>
</html>
