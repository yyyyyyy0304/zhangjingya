<!DOCTYPE html>
<html lang="zh-CN">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>张婧雅的运动相册</title>
	<style>
		* {
			box-sizing: border-box;
		}

		body {
			min-height: 100vh;
			margin: 0;
			display: grid;
			place-items: center;
			background: #000;
			color: #fff;
			font-family: "Microsoft YaHei", "PingFang SC", sans-serif;
		}

		.slideshow {
			position: relative;
			width: min(900px, calc(100% - 32px));
			height: min(68vh, 560px);
			min-height: 340px;
			overflow: hidden;
			border-radius: 14px;
			border: 1px solid #262626;
			background: #000;
		}

		.track {
			display: flex;
			width: 400%;
			height: 100%;
			animation: slide-position 13.5s infinite;
		}

		.slide {
			position: relative;
			flex: 0 0 25%;
			height: 100%;
			overflow: hidden;
			background: #000;
		}

		.slide img {
			display: block;
			width: 100%;
			height: 100%;
			object-fit: cover;
		}

		/* 字在图片上：透明背景 + 黑底白字 */
		.caption {
			position: absolute;
			inset: 0;
			display: flex;
			flex-direction: column;
			justify-content: flex-end;
			gap: 8px;
			padding: 32px 34px;
			background: transparent;
			color: #fff;
		}

		.caption h1,
		.caption h2,
		.caption p {
			color: #fff;
			text-shadow: 0 2px 12px rgb(0 0 0 / 85%);
		}

		.caption h1,
		.caption h2 {
			margin: 0;
			font-size: 26px;
		}

		.caption p {
			margin: 0;
			font-size: 15px;
			line-height: 1.6;
		}

		@keyframes slide-position {
			0%, 25% {
				transform: translateX(0);
				animation-timing-function: ease-in-out;
			}
			33.333%, 58.333% {
				transform: translateX(-25%);
				animation-timing-function: ease-in-out;
			}
			66.666%, 91.666% {
				transform: translateX(-50%);
				animation-timing-function: ease-in-out;
			}
			100% {
				transform: translateX(-75%);
			}
		}

		@media (max-width: 600px) {
			.slide {
				height: 62vh;
				min-height: 300px;
			}

			.caption {
				padding: 20px;
			}

			.caption h1,
			.caption h2 {
				font-size: 21px;
			}
		}

		@media (prefers-reduced-motion: reduce) {
			.track {
				animation: none;
				transform: translateX(0);
			}
		}
	</style>
</head>
<body>
	<main class="slideshow" aria-label="张婧雅的运动相册">
		<div class="track">
			<section class="slide">
				<img src="../9/img/1.jpg" alt="孩子们在绿茵场上练习足球">
				<div class="caption">
					<h1>张婧雅 · 绿茵时光</h1>
					<p>迎着阳光，向着足球奔跑。</p>
				</div>
			</section>
			<section class="slide">
				<img src="../9/img/2.jpg" alt="一群孩子在操场上进行足球训练">
				<div class="caption">
					<h2>一起练习，一起进步</h2>
					<p>操场上的每一次奔跑，都是新的尝试。</p>
				</div>
			</section>
			<section class="slide">
				<img src="../9/img/3.jpg" alt="孩子们在操场上参加跳绳活动">
				<div class="caption">
					<h2>跳出轻快的节奏</h2>
					<p>和伙伴们一起，享受运动的快乐。</p>
				</div>
			</section>
			<section class="slide" aria-hidden="true">
				<img src="../9/img/1.jpg" alt="">
				<div class="caption">
					<h2>张婧雅 · 绿茵时光</h2>
					<p>迎着阳光，向着足球奔跑。</p>
				</div>
			</section>
		</div>
	</main>
</body>
</html>
