<!DOCTYPE html>
<html lang="zh-CN">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>张婧雅的运动相册</title>
	<style>
		* {
			box-sizing: border-box;
		}

		body {
			min-height: 100vh;
			margin: 0;
			background: #f2f5f0;
			color: #202d28;
			font-family: "Microsoft YaHei", "PingFang SC", sans-serif;
		}

		.page {
			width: min(100% - 40px, 960px);
			margin: 0 auto;
			padding: 38px 0 48px;
		}

		.page-header {
			display: flex;
			align-items: end;
			justify-content: space-between;
			gap: 20px;
			margin-bottom: 24px;
		}

		.eyebrow {
			margin: 0 0 8px;
			color: #d05236;
			font-size: 13px;
			font-weight: 700;
		}

		h1 {
			margin: 0;
			font-size: 36px;
			line-height: 1.2;
		}

		.edition {
			margin: 0 0 4px;
			color: #68756f;
			font-size: 14px;
		}

		.slideshow {
			position: relative;
			height: 580px;
			overflow: hidden;
			border: 1px solid #d8e0d9;
			border-radius: 14px;
			background: #fff;
			box-shadow: 0 18px 48px rgb(35 54 44 / 10%);
		}

		.slide {
			position: absolute;
			inset: 0;
			display: grid;
			grid-template-rows: minmax(0, 1fr) auto;
			margin: 0;
			opacity: 0;
			visibility: hidden;
			animation: show-slide 12s linear infinite;
		}

		.slide:nth-child(2) {
			animation-delay: -8s;
		}

		.slide:nth-child(3) {
			animation-delay: -4s;
		}

		.slide img {
			width: 100%;
			height: 100%;
			min-height: 0;
			object-fit: cover;
		}

		.caption {
			display: flex;
			align-items: center;
			justify-content: space-between;
			gap: 20px;
			padding: 18px 24px;
			background: #fff;
		}

		.caption h2 {
			margin: 0 0 5px;
			font-size: 21px;
		}

		.caption p {
			margin: 0;
			color: #68756f;
			font-size: 14px;
		}

		.number {
			flex: none;
			color: #d05236;
			font-size: 14px;
			font-weight: 700;
			font-variant-numeric: tabular-nums;
		}

		@keyframes show-slide {
			0%, 30% {
				opacity: 1;
				visibility: visible;
			}
			34%, 100% {
				opacity: 0;
				visibility: hidden;
			}
		}

		@media (max-width: 600px) {
			.page {
				width: min(100% - 28px, 960px);
				padding-top: 26px;
			}

			.page-header {
				align-items: start;
			}

			h1 {
				font-size: 30px;
			}

			.edition {
				font-size: 12px;
			}

			.slideshow {
				height: 470px;
			}

			.caption {
				padding: 16px;
			}

			.caption h2 {
				font-size: 18px;
			}

			.caption p {
				font-size: 13px;
			}
		}

		@media (prefers-reduced-motion: reduce) {
			.slide {
				animation: none;
			}

			.slide:not(:first-child) {
				display: none;
			}

			.slide:first-child {
				opacity: 1;
				visibility: visible;
			}
		}
	</style>
</head>
<body>
	<main class="page">
		<header class="page-header">
			<div>
				<p class="eyebrow">活力 · 成长 · 瞬间</p>
				<h1>张婧雅</h1>
			</div>
			<p class="edition">运动相册　/　2026</p>
		</header>

		<section class="slideshow" aria-label="张婧雅的运动相册">
			<figure class="slide">
				<img src="../9/img/1.jpg" alt="孩子们在绿茵场上练习足球">
				<figcaption class="caption">
					<div>
						<h2>绿茵场上的小球员</h2>
						<p>迎着阳光，向着足球奔跑。</p>
					</div>
					<span class="number">01 / 03</span>
				</figcaption>
			</figure>

			<figure class="slide">
				<img src="../9/img/2.jpg" alt="一群孩子在操场上进行足球训练">
				<figcaption class="caption">
					<div>
						<h2>一起练习，一起进步</h2>
						<p>操场上的每一次奔跑，都是新的尝试。</p>
					</div>
					<span class="number">02 / 03</span>
				</figcaption>
			</figure>

			<figure class="slide">
				<img src="../9/img/3.jpg" alt="孩子们在操场上参加跳绳活动">
				<figcaption class="caption">
					<div>
						<h2>跳出轻快的节奏</h2>
						<p>和伙伴们一起，享受运动的快乐。</p>
					</div>
					<span class="number">03 / 03</span>
				</figcaption>
			</figure>
		</section>
	</main>
</body>
</html>
