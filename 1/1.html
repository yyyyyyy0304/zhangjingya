<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>115张婧雅</title>
    <style>
        :root {
            --bg1: #f6d365;
            --bg2: #fda085;
            --bg3: #c471f5;
            --bg4: #7367f0;
            --white: #ffffff;
            --text: #fff7fb;
            --glass: rgba(255, 255, 255, 0.18);
            --glass-border: rgba(255, 255, 255, 0.32);
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: grid;
            place-items: center;
            font-family: "Microsoft YaHei", "PingFang SC", Arial, sans-serif;
            background: linear-gradient(135deg, var(--bg1) 0%, var(--bg2) 30%, var(--bg3) 70%, var(--bg4) 100%);
            color: var(--text);
        }

        .card {
            width: min(480px, 88vw);
            padding: 54px 38px;
            border-radius: 28px;
            background: var(--glass);
            border: 1px solid var(--glass-border);
            box-shadow: 0 24px 60px rgba(76, 32, 110, 0.26);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            text-align: center;
            position: relative;
            overflow: hidden;
        }

        .card::before {
            content: "";
            position: absolute;
            inset: -30% auto auto -20%;
            width: 180px;
            height: 180px;
            background: rgba(255, 255, 255, 0.15);
            border-radius: 50%;
            filter: blur(8px);
        }

        .badge {
            position: relative;
            display: inline-block;
            margin-bottom: 18px;
            padding: 8px 16px;
            border-radius: 999px;
            font-size: 12px;
            letter-spacing: 2px;
            text-transform: uppercase;
            background: rgba(255, 255, 255, 0.15);
            border: 1px solid rgba(255, 255, 255, 0.25);
        }

        h1 {
            position: relative;
            margin: 0 0 14px;
            font-size: clamp(2.2rem, 5vw, 3.4rem);
            line-height: 1.2;
            font-weight: 700;
            letter-spacing: 2px;
        }

        p {
            position: relative;
            margin: 0;
            font-size: 1rem;
            line-height: 1.8;
            color: rgba(255, 255, 255, 0.9);
        }

        .actions {
            position: relative;
            margin-top: 28px;
        }

        .btn {
            display: inline-block;
            padding: 12px 24px;
            border: none;
            border-radius: 999px;
            background: linear-gradient(135deg, #fff 0%, #f9d7ff 100%);
            color: #59329e;
            font-size: 0.96rem;
            font-weight: 700;
            box-shadow: 0 10px 20px rgba(99, 58, 190, 0.28);
            cursor: pointer;
            transition: transform 0.25s ease, box-shadow 0.25s ease;
        }

        .btn:hover {
            transform: translateY(-2px) scale(1.02);
            box-shadow: 0 14px 28px rgba(99, 58, 190, 0.32);
        }
    </style>
</head>
<body>
    <div class="card">
        <div class="badge">Personal Page</div>
        <h1>115张婧雅</h1>
        <p>欢迎来到我的页面，愿每一天都充满光彩与温柔。</p>
        <div class="actions">
            <button class="btn">了解更多</button>
        </div>
    </div>
</body>
</html>
