<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>115 张婧雅</title>
    <style> 
        h2,h3,p{
            padding: 0;
            margin: 0;
        }
        #box{
            padding: 8px;
            margin: 20px;
            border: 1px solid #ccc;
            font-size: 12px;
            width: 480px;
        }
        #box h3{
           /* 字体大小 */
           font-size: 16px;
           /* 行高 */
           line-height: 33px;
           /*居中 */
           text-align: center;
           /* 颜色 */
              color: #034;
            /*字距 */
              letter-spacing: 3px;
        }
        #box p{
            /* 颜色 */
               color: #666;
            /* 首行空2格 */
               text-indent: 2em;
            /* 行高 */
               line-height: 150%;
        }
        #box a{
            /* 颜色 */
               color: #c00;
            /* 下划线 */
               text-decoration: none;
        }
        .bb{
                /* 颜色 */
                    color: blue;
                /* 字体粗细 */
                    font-weight: bold;
        }
        h2{
                /* 背景颜色 */
                    background-color: #000;
                /* 文字颜色 */
                    color: #fff;
        }
        .knowledge{
                /* 背景颜色 */
                    background-color: blue;
                /* 文字颜色 */
                    color: #fff;
        }
    </style>
</head>
<body>
    <h2>CSS2群组选择器和后代选择器</h2>
    <div id="box" >
         <h3>CSS进阶</h3>
        <p>学号：<span class="bb">115</span>，姓名：<span class="bb">张婧雅</span>，班级：<span class="bb">计算机24002</span>，《高级网页设计》设计的学习难度：一般，
            本实例的知识点：<span class="knowledge">CSS 群组选择器和后代选择器</span>。
            <a href="#">【更多】</a>
        </p>
    </div>
    <!--扩展：1.学号、姓名、班级的值是蓝色加粗，使用1个css选择器
    2.h2黑底白字
    3.知识点的值蓝底白字-->


    
</body>
</html>
